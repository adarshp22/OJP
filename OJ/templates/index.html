{% extends "layout.html" %}

{% block title %}My Compiler{% endblock %}

{% block content %}
<h2 class="text-center mt-4">MoJ</h2>

<form method="post">
  {% csrf_token %}

  <div style="margin-bottom: 1rem;">
    <label for="languageSelector" style="font-weight: 600;">Select Language:</label>
    <select name="language" id="languageSelector" onchange="changeLanguage(this.value)">
  <option value="py" {% if selected_lang == "py" %}selected{% endif %}>Python</option>
  <option value="cpp" {% if selected_lang == "cpp" %}selected{% endif %}>C++</option>
  <option value="c" {% if selected_lang == "c" %}selected{% endif %}>C</option>
</select>

  </div>

  <div style="display: flex; gap: 20px;">
    <div style="flex: 2; display: flex; flex-direction: column;">
      <label for="codeEditor" style="font-weight: 600;">Code:</label>
      <textarea id="codeEditor" name="code" placeholder="Write your code here...">{{ form.code.value|default_if_none:'' }}</textarea>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <label for="inputData" style="font-weight: 600;">Input:</label>
      <textarea name="input_data" id="inputData" placeholder="Give Input">{{ form.input_data.value|default_if_none:'' }}</textarea>
    </div>
  </div>

  <button type="submit" style="background:#007bff; margin-top:3px;color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer;">
    Run Code
  </button>
</form>

{% if submission %}
<hr>
<h2>Execution Result</h2>
<p><strong>Output:</strong></p>
<pre class="bg-dark p-3 border rounded" style="white-space: pre-wrap;">{{ submission.output_data }}</pre>
{% endif %}

<style>
  #codeEditor, #inputData {
    height: 500px;
    width: 100%;
    resize: none;
    font-family: monospace;
    font-size: 14px;
  }
  .CodeMirror {
    height: 500px;
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding-left: 10px;
    font-size: 14px;
  }
</style>

<script>
  const modeMap = {
    "py": "python",
    "cpp": "text/x-c++src",
    "c": "text/x-csrc"
  };

  const selectedLang = "{{ selected_lang }}";

  var editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
    lineNumbers: true,
    mode: modeMap["{{ selected_lang }}"] || "python",
    theme: "default",
    autoCloseBrackets: true,
    matchBrackets: true,
    indentUnit: 4,
    indentWithTabs: true
  });

  editor.setSize(null, "500px");

  function changeLanguage(lang) {
    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
  }
</script>

{% endblock %}
